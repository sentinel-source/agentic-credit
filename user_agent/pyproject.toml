[project]
name = "user-agent"
version = "0.1.0"
description = "AI-powered User Agent for the Agentic Credit Broking Protocol"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
user-agent = "user_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
