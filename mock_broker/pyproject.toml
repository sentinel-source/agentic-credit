[project]
name = "mock-broker"
version = "0.1.0"
description = "Mock Credit Broker implementing the Agentic Credit Broking Protocol"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mock-broker = "mock_broker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
